<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#191919">
<title>JewelDesk | Business Workspace</title>
<style>
:root{--ink:#1d1d1b;--gold:#c6a96b;--gold2:#ead9ae;--paper:#f5f3ee;--muted:#77756f;--line:#e7e3da;--white:#fff;--green:#26734d;--amber:#9a6b17}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}
.sidebar{background:#191919;color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.gem{width:38px;height:38px;border-radius:12px;background:var(--gold);display:grid;place-items:center;color:#191919;font-size:21px}.brand b{font-size:19px;letter-spacing:.2px}.brand small{display:block;color:#aaa;font-size:9px;letter-spacing:1.5px;margin-top:3px}.navlabel{color:#8c8c8c;font-size:10px;letter-spacing:1.5px;padding:0 10px;margin-bottom:5px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8c8c8;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#302d27;color:#f0dba9}.nav .ico{width:19px;text-align:center}.sidebottom{margin-top:auto;border-top:1px solid #383838;padding:16px 8px;color:#aaa;font-size:12px}
main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.crumb{font-weight:650}.user{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#eee4cf;display:grid;place-items:center;font-weight:700}
.content{max-width:1400px;margin:auto;padding:30px}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#987a3d;font-weight:700}.welcome h1{font-size:28px;margin:6px 0}.sub{color:var(--muted);font-size:13px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#202020;color:white;font-weight:650}.btn.gold{background:var(--gold);color:#201d16}.btn.light{background:#fff;color:#333;border:1px solid var(--line)}.btn.small{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.statnum{font-size:27px;font-weight:750;margin:10px 0 3px}.statnote{font-size:11px;color:#8b887f}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:16px}.cardtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.cardtitle h3{font-size:15px;margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#89867f;font-size:10px;letter-spacing:.8px;font-weight:650;padding:11px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #f0eee9;font-size:12px}tr:last-child td{border:0}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:30px;padding:5px 9px;background:#f1eee7;color:#665d4d;font-size:10px;font-weight:700}.pill.green{background:#e5f2e9;color:var(--green)}.pill.amber{background:#f8efd9;color:var(--amber)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{background:#242424;color:#fff;border:1px solid #383838;border-radius:10px;padding:13px;text-align:left}.quick strong{display:block;color:var(--gold2);font-size:12px;margin-top:7px}.quick span{font-size:19px}.activity{display:grid;gap:14px}.activityitem{display:flex;gap:10px;font-size:12px}.dot{width:8px;height:8px;background:var(--gold);border-radius:50%;margin-top:4px;flex:none}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.pagehead h1{margin:0;font-size:25px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:11px;color:#69665f;font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #dedad0;border-radius:8px;padding:10px 11px;background:#fff;min-width:0;width:100%;outline-color:var(--gold)}.toolbar input{max-width:260px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}.hidden{display:none!important}.notice{background:#fff8e8;border:1px solid #ead9ae;padding:12px;border-radius:9px;color:#66542e;font-size:12px;line-height:1.5;margin-bottom:16px}
.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:#fff;border-radius:15px;width:min(600px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{font-size:19px;margin:0}.close{border:0;background:#f1eee7;border-radius:8px;padding:7px 10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.brand{padding:4px}.nav{display:flex;overflow:auto}.navlabel,.sidebottom{display:none}.nav button{white-space:nowrap;padding:9px}.topbar{height:58px;padding:0 16px}.content{padding:20px 15px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}
@media(max-width:480px){.welcome{display:block}.welcome .btn{margin-top:14px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.stats{gap:9px}.card{padding:14px}.statnum{font-size:23px}}
</style></head>
<body>
<div class="shell">
<aside class="sidebar">
 <div class="brand"><div class="gem">◇</div><div><b>JewelDesk</b><small>BUSINESS WORKSPACE</small></div></div>
 <div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
  <button data-page="orders"><span class="ico">◈</span>Orders</button>
  <button data-page="customers"><span class="ico">♙</span>Customers</button>
  <button data-page="stones"><span class="ico">◇</span>Diamonds & gemstones</button>
  <button data-page="manufacturers"><span class="ico">⚒</span>Manufacturers</button>
  <button data-page="payments"><span class="ico">₹</span>Payments</button>
  <button data-page="team"><span class="ico">♧</span>Team & access</button>
 </nav></div>
 <div class="sidebottom">Private business workspace<br><span style="color:#777">Prototype v1.0 · Sample/local data</span></div>
</aside>
<main>
 <header class="topbar"><div class="crumb" id="crumb">Dashboard</div><div class="user"><span id="roleLabel">Owner view</span><button class="btn light small" onclick="ownerSignOut()">Sign out</button><div class="avatar">JD</div></div></header>
 <div class="content" id="app"></div>
</main></div>
<div id="modalRoot"></div>
<div id="loginGate" style="position:fixed;inset:0;background:#f7f5f0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:white;padding:28px;border-radius:18px;max-width:420px;width:100%;box-shadow:0 12px 40px #0001">
    <div style="font-size:12px;letter-spacing:2px;color:#9a7b43;font-weight:700">JEWELDESK</div><h2 style="margin:10px 0">Owner sign in</h2>
    <p style="color:#777;font-size:14px">Sign in with the owner account you created in Firebase.</p>
    <label style="display:block;margin:14px 0 6px">Email</label><input id="loginEmail" type="email" autocomplete="username" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px">
    <label style="display:block;margin:14px 0 6px">Password</label><input id="loginPassword" type="password" autocomplete="current-password" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px">
    <button id="loginBtn" style="margin-top:18px;width:100%;padding:13px;background:#b28b4e;color:white;border:0;border-radius:8px;font-weight:700">Sign in</button><div id="loginMessage" style="font-size:13px;color:#a33;margin-top:12px"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
const firebaseConfig={apiKey:"AIzaSyA4R6HEM913ISdsUMaAFalIVPSTMM4j-lk",authDomain:"jeweldesk-67aab.firebaseapp.com",projectId:"jeweldesk-67aab",storageBucket:"jeweldesk-67aab.firebasestorage.app",messagingSenderId:"967472227227",appId:"1:967472227227:web:e742d0fb74987d3934b73e",measurementId:"G-95GJHNLZ12"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();const OWNER_EMAIL='sanyampirodia@gmail.com';let cloudReady=false,currentUser=null;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('jd_'+k))??d}catch{return d}};
const save=(k,v)=>{localStorage.setItem('jd_'+k,JSON.stringify(v));if(cloudReady&&currentUser&&currentUser.email.toLowerCase()===OWNER_EMAIL){db.collection('appData').doc(k).set({items:v,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>alert('Cloud save failed: '+e.message));}};
async function loadCloudData(){for(const k of ['orders','customers','makers','stones','payments']){const snap=await db.collection('appData').doc(k).get();if(snap.exists&&Array.isArray(snap.data().items))localStorage.setItem('jd_'+k,JSON.stringify(snap.data().items));}orders=load('orders',orders);customers=load('customers',customers);makers=load('makers',makers);stones=load('stones',stones);payments=load('payments',payments);cloudReady=true;render();}
$('#loginBtn').addEventListener('click',async()=>{const msg=$('#loginMessage');msg.textContent='Signing in…';try{const email=$('#loginEmail').value.trim();if(email.toLowerCase()!==OWNER_EMAIL)throw new Error('Only the designated owner account can sign in to this first release.');await auth.signInWithEmailAndPassword(email,$('#loginPassword').value);}catch(e){msg.textContent=e.message;}});
auth.onAuthStateChanged(async user=>{currentUser=user;if(user&&user.email&&user.email.toLowerCase()===OWNER_EMAIL){$('#loginGate').style.display='none';try{await loadCloudData();}catch(e){cloudReady=false;$('#loginGate').style.display='flex';$('#loginMessage').textContent='Could not load cloud data: '+e.message;}}else{cloudReady=false;$('#loginGate').style.display='flex';if(user)await auth.signOut();}});
let orders=load('orders',[
{id:'JD-0001',customer:'Aarav Mehta',product:'Diamond Ring',metal:'18K Rose Gold',stone:'Natural diamond',value:85000,advance:25000,due:'2026-12-15',status:'In production',maker:'Internal workshop',created:'2026-11-20'},
{id:'JD-0002',customer:'Mira Shah',product:'Emerald Pendant',metal:'18K Yellow Gold',stone:'Emerald',value:62000,advance:20000,due:'2026-12-20',status:'Design',maker:'Shree Creations',created:'2026-11-22'},
{id:'JD-0003',customer:'Dev Patel',product:'Gold Bracelet',metal:'22K Yellow Gold',stone:'None',value:48000,advance:48000,due:'2026-12-05',status:'Confirmed',maker:'Internal workshop',created:'2026-11-24'}]);
let customers=load('customers',[{name:'Aarav Mehta',phone:'98XXXXXX10',notes:'Prefers WhatsApp updates'},{name:'Mira Shah',phone:'98XXXXXX22',notes:'Emerald pendant client'},{name:'Dev Patel',phone:'98XXXXXX35',notes:'Repeat customer'}]);
let makers=load('makers',['Internal workshop','Shree Creations']);
let stones=load('stones',[]);
let payments=load('payments',[]);
let page='dashboard';
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function ownerSignOut(){cloudReady=false;auth.signOut()}
function nav(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent=({dashboard:'Dashboard',orders:'Orders',customers:'Customers',stones:'Diamonds & gemstones',manufacturers:'Manufacturers',payments:'Payments',team:'Team & access'})[p];render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)nav(b.dataset.page)});
function stats(){return `<div class="stats">
<div class="card"><div class="stathead">Total orders <span>◈</span></div><div class="statnum">${orders.length}</div><div class="statnote">All recorded orders</div></div>
<div class="card"><div class="stathead">In progress <span>◷</span></div><div class="statnum">${orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length}</div><div class="statnote">Open orders</div></div>
<div class="card"><div class="stathead">Order value <span>₹</span></div><div class="statnum">${money(orders.reduce((a,o)=>a+Number(o.value),0))}</div><div class="statnote">Value of recorded orders</div></div>
<div class="card"><div class="stathead">Balance due <span>◉</span></div><div class="statnum">${money(orders.reduce((a,o)=>a+Number(o.value)-Number(o.advance),0))}</div><div class="statnote">Value less recorded advances</div></div></div>`}
function orderRows(list){if(!list.length)return `<tr><td colspan="7" class="empty">No orders found. Create your first order.</td></tr>`;return list.map(o=>`<tr><td><b>${o.id}</b><div class="muted">${o.created||''}</div></td><td>${esc(o.customer)}</td><td>${esc(o.product)}</td><td>${money(o.value)}</td><td>${money(o.advance)}</td><td><span class="pill ${o.status==='Delivered'?'green':o.status==='In production'?'amber':''}">${esc(o.status)}</span></td><td><button class="btn light small" onclick="editStatus('${o.id}')">Update</button></td></tr>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dashboard(){return `<div class="welcome"><div><div class="eyebrow">BUSINESS OVERVIEW</div><h1>Good afternoon.</h1><div class="sub">Here's what's happening in your jewellery business.</div></div><button class="btn gold" onclick="newOrder()">＋ Create new order</button></div>${stats()}<div class="layout"><section class="card"><div class="cardtitle"><h3>Recent orders</h3><button class="btn light small" onclick="nav('orders')">View all</button></div><div class="tablewrap"><table><thead><tr><th>ORDER</th><th>CUSTOMER</th><th>PRODUCT</th><th>VALUE</th><th>ADVANCE</th><th>STATUS</th><th></th></tr></thead><tbody>${orderRows(orders.slice(0,5))}</tbody></table></div></section><section class="card"><div class="cardtitle"><h3>Quick actions</h3></div><div class="quick"><button onclick="newOrder()"><span>＋</span><strong>New order</strong></button><button onclick="newCustomer()"><span>♙</span><strong>Add customer</strong></button><button onclick="newStone()"><span>◇</span><strong>Add stone</strong></button><button onclick="nav('manufacturers')"><span>⚒</span><strong>Manufacturers</strong></button></div><div class="cardtitle" style="margin-top:22px"><h3>Work in progress</h3></div><div class="activity">${orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).slice(0,4).map(o=>`<div class="activityitem"><span class="dot"></span><div><b>${esc(o.id)} · ${esc(o.product)}</b><div class="muted">${esc(o.status)} · ${esc(o.maker)}</div></div></div>`).join('')||'<div class="muted">No open orders.</div>'}</div></section></div>`}
function ordersPage(){return `<div class="pagehead"><div><h1>Orders</h1><div class="sub">Create and track customer jewellery orders.</div></div><button class="btn gold" onclick="newOrder()">＋ New order</button></div>${stats()}<div class="card"><div class="toolbar"><input id="orderSearch" placeholder="Search order, customer or product…" oninput="filterOrders()"><select id="statusFilter" onchange="filterOrders()"><option value="">All statuses</option>${['Enquiry','Confirmed','Design','In production','Quality check','Ready for delivery','Delivered','Cancelled'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>ORDER</th><th>CUSTOMER</th><th>PRODUCT</th><th>VALUE</th><th>ADVANCE</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody id="orderBody">${orderRows(orders)}</tbody></table></div></div>`}
function filterOrders(){let q=$('#orderSearch').value.toLowerCase(),s=$('#statusFilter').value;$('#orderBody').innerHTML=orderRows(orders.filter(o=>(!s||o.status===s)&&[o.id,o.customer,o.product].join(' ').toLowerCase().includes(q)))}
function customersPage(){return `<div class="pagehead"><div><h1>Customers</h1><div class="sub">Customer profiles and order relationships.</div></div><button class="btn gold" onclick="newCustomer()">＋ Add customer</button></div><div class="card"><div class="tablewrap"><table><thead><tr><th>CUSTOMER</th><th>PHONE</th><th>ORDERS</th><th>NOTES</th></tr></thead><tbody>${customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${orders.filter(o=>o.customer===c.name).length}</td><td>${esc(c.notes)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No customers yet.</td></tr>'}</tbody></table></div></div>`}
function stonesPage(){return `<div class="pagehead"><div><h1>Diamonds & gemstones</h1><div class="sub">Maintain stone specifications and report references.</div></div><button class="btn gold" onclick="newStone()">＋ Add stone</button></div><div class="notice">Record certificate details and treatments accurately. A certificate/report number is a reference, not a substitute for verifying the original report.</div><div class="card"><div class="tablewrap"><table><thead><tr><th>TYPE</th><th>DESCRIPTION</th><th>WEIGHT</th><th>COLOUR</th><th>CLARITY / TREATMENT</th><th>REPORT / ID</th></tr></thead><tbody>${stones.map(s=>`<tr><td>${esc(s.type)}</td><td><b>${esc(s.shape||s.variety)}</b><div class="muted">${esc(s.origin||'Origin not recorded')}</div></td><td>${esc(s.weight)} ct</td><td>${esc(s.colour||'—')}</td><td>${esc(s.detail||'—')}</td><td>${esc(s.report||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No stones recorded yet.</td></tr>'}</tbody></table></div></div>`}
function makersPage(){return `<div class="pagehead"><div><h1>Manufacturers</h1><div class="sub">Manage internal workshops and external manufacturing partners.</div></div><button class="btn gold" onclick="newMaker()">＋ Add manufacturer</button></div><div class="notice"><b>Access model:</b> External manufacturers should receive their own login and see only orders explicitly assigned to them. This prototype records assignments but does not yet create secure accounts or send invitations.</div><div class="card"><div class="tablewrap"><table><thead><tr><th>MANUFACTURER</th><th>TYPE</th><th>ASSIGNED ORDERS</th><th>ACCESS</th></tr></thead><tbody>${makers.map(m=>`<tr><td><b>${esc(m)}</b></td><td>${m==='Internal workshop'?'Internal':'External partner'}</td><td>${orders.filter(o=>o.maker===m&&!['Delivered','Cancelled'].includes(o.status)).length}</td><td><span class="pill">${m==='Internal workshop'?'Internal team':'Not invited yet'}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function paymentsPage(){let due=orders.reduce((a,o)=>a+Number(o.value)-Number(o.advance),0);return `<div class="pagehead"><div><h1>Payments</h1><div class="sub">Track order advances and outstanding balances.</div></div></div><div class="stats"><div class="card"><div class="stathead">Total order value</div><div class="statnum">${money(orders.reduce((a,o)=>a+Number(o.value),0))}</div></div><div class="card"><div class="stathead">Advances recorded</div><div class="statnum">${money(orders.reduce((a,o)=>a+Number(o.advance),0))}</div></div><div class="card"><div class="stathead">Outstanding balance</div><div class="statnum">${money(due)}</div></div><div class="card"><div class="stathead">Payment entries</div><div class="statnum">${payments.length}</div></div></div><div class="card"><div class="cardtitle"><h3>Order balances</h3></div><div class="tablewrap"><table><thead><tr><th>ORDER</th><th>CUSTOMER</th><th>ORDER VALUE</th><th>ADVANCE</th><th>BALANCE</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.customer)}</td><td>${money(o.value)}</td><td>${money(o.advance)}</td><td><b>${money(o.value-o.advance)}</b></td></tr>`).join('')}</tbody></table></div></div>`}
function teamPage(){return `<div class="pagehead"><div><h1>Team & access</h1><div class="sub">Plan who can view and change business information.</div></div></div><div class="notice"><b>Prototype limitation:</b> These are proposed roles, not enforced security controls yet. Before using real customer or financial data, we must implement authenticated accounts, server-side role checks and audit logs.</div><div class="layout"><div class="card"><div class="cardtitle"><h3>Access roles</h3></div><table><thead><tr><th>ROLE</th><th>PROPOSED PERMISSIONS</th></tr></thead><tbody><tr><td><b>Owner</b></td><td>All modules, financials, settings, user access</td></tr><tr><td><b>Manager</b></td><td>Orders, customers, inventory, assigned finance</td></tr><tr><td><b>Employee</b></td><td>Assigned tasks and permitted order fields</td></tr><tr><td><b>External maker</b></td><td>Only assigned job cards, specs and progress updates</td></tr></tbody></table></div><div class="card"><div class="cardtitle"><h3>Data and security checklist</h3></div><p class="sub">Before live deployment:</p><p>✓ Individual sign-in for every person</p><p>✓ Restrict external maker records by assignment</p><p>✓ Hide customer contact and margin data where not needed</p><p>✓ Backups and activity history</p><p>✓ Secure file access for certificates and CAD</p></div></div>`}
function render(){let views={dashboard,orders:ordersPage,customers:customersPage,stones:stonesPage,manufacturers:makersPage,payments:paymentsPage,team:teamPage};$('#app').innerHTML=views[page]();$('#roleLabel').textContent='Owner view'}
function modal(title,body,submit){$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${body}<div class="actions"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn gold" id="saveModal">Save</button></div></div></div>`;$('#saveModal').onclick=submit}
function closeModal(){$('#modalRoot').innerHTML=''}
function newOrder(){let opts=customers.map(c=>`<option>${esc(c.name)}</option>`).join('');let mopts=makers.map(m=>`<option>${esc(m)}</option>`).join('');modal('Create new order',`<div class="formgrid">
<div class="field"><label>Customer</label><select id="fCustomer">${opts}</select></div><div class="field"><label>Product name</label><input id="fProduct" placeholder="e.g. Diamond engagement ring" required></div>
<div class="field"><label>Metal / purity</label><input id="fMetal" placeholder="e.g. 18K rose gold"></div><div class="field"><label>Stone type</label><select id="fStone"><option>Natural diamond</option><option>Lab-grown diamond</option><option>Ruby</option><option>Sapphire</option><option>Emerald</option><option>Other gemstone</option><option>None</option></select></div>
<div class="field"><label>Order value (₹)</label><input id="fValue" type="number" min="0" placeholder="0"></div><div class="field"><label>Advance received (₹)</label><input id="fAdvance" type="number" min="0" placeholder="0"></div>

<div class="field full"><label>Design / order notes</label><textarea id="fNotes" rows="2" placeholder="Design reference, size, specifications…"></textarea></div></div>`,()=>{let product=$('#fProduct').value.trim();if(!product){alert('Please enter a product name.');return}let id='JD-'+String(Math.max(0,...orders.map(o=>Number(o.id.split('-')[1])||0))+1).padStart(4,'0');orders.unshift({id,customer:$('#fCustomer').value,product,metal:$('#fMetal').value,stone:$('#fStone').value,value:+$('#fValue').value||0,advance:+$('#fAdvance').value||0,due:$('#fDue').value,status:'Enquiry',maker:$('#fMaker').value,notes:$('#fNotes').value,created:new Date().toISOString().slice(0,10)});save('orders',orders);closeModal();nav('orders')})}
function editStatus(id){let o=orders.find(x=>x.id===id);if(!o)return;modal('Update '+id,`<div class="field"><label>Order status</label><select id="newStatus">${['Enquiry','Confirmed','Design','In production','Quality check','Ready for delivery','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Advance received (₹)</label><input id="newAdvance" type="number" min="0" value="${o.advance}"></div>`,()=>{o.status=$('#newStatus').value;o.advance=Number($('#newAdvance').value)||0;save('orders',orders);closeModal();render()})}
function newCustomer(){modal('Add customer',`<div class="field"><label>Customer name</label><input id="cName" required></div><div class="field"><label>Phone</label><input id="cPhone" placeholder="Phone number"></div><div class="field"><label>Notes</label><textarea id="cNotes" rows="2"></textarea></div>`,()=>{let name=$('#cName').value.trim();if(!name){alert('Enter customer name');return}customers.push({name,phone:$('#cPhone').value,notes:$('#cNotes').value});save('customers',customers);closeModal();nav('customers')})}
function newStone(){modal('Add diamond / gemstone',`<div class="formgrid"><div class="field"><label>Stone type</label><select id="sType"><option>Natural diamond</option><option>Lab-grown diamond</option><option>Ruby</option><option>Sapphire</option><option>Emerald</option><option>Spinel</option><option>Tourmaline</option><option>Other</option></select></div><div class="field"><label>Shape / variety</label><input id="sShape"></div><div class="field"><label>Weight (carat)</label><input id="sWeight" type="number" step=".01"></div><div class="field"><label>Colour</label><input id="sColour"></div><div class="field"><label>Clarity / treatment</label><input id="sDetail"></div><div class="field"><label>Report / stock ID</label><input id="sReport"></div><div class="field full"><label>Origin (if known)</label><input id="sOrigin"></div></div>`,()=>{stones.push({type:$('#sType').value,shape:$('#sShape').value,weight:$('#sWeight').value,colour:$('#sColour').value,detail:$('#sDetail').value,report:$('#sReport').value,origin:$('#sOrigin').value});save('stones',stones);closeModal();nav('stones')})}
function newMaker(){modal('Add manufacturer',`<div class="field"><label>Manufacturer / workshop name</label><input id="mName" placeholder="Company or workshop name"></div><div class="notice">Adding a name here creates a selectable assignment only. Secure external invitations will be added in the cloud-connected release.</div>`,()=>{let n=$('#mName').value.trim();if(!n){alert('Enter a manufacturer name');return}if(!makers.includes(n))makers.push(n);save('makers',makers);closeModal();nav('manufacturers')})}
</script></body></html>
